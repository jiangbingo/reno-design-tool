<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型装修设计台</title>
<style>
  :root{
    --ink:#2b313b; --paper:#f6f4ef; --panel:#ffffff; --line:#d9d5cc;
    --accent:#1d4e89; --accent-soft:#e8eef6; --danger:#b3402f;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:20}
  .brand{font-weight:700;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;padding-right:10px;border-right:1px solid var(--line)}
  .brand i{width:10px;height:10px;background:var(--accent);display:inline-block;border-radius:2px}
  .group{display:flex;align-items:center;gap:4px;padding:0 8px;border-right:1px solid var(--line)}
  .group:last-child{border-right:none}
  button{font:13px/1 -apple-system,"PingFang SC",sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  button:hover{background:#f0eee8}
  button.on{background:var(--accent);color:#fff}
  button.ghost{border-color:var(--line)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border-radius:0;padding:7px 14px}
  .seg button+button{border-left:1px solid var(--line)}

  #stage{position:relative;flex:1;overflow:hidden}
  .layer{position:absolute;inset:0;transition:opacity .45s ease,transform .45s ease}
  .layer.hidden{opacity:0;pointer-events:none;transform:scale(.965)}
  #c2d{display:block;width:100%;height:100%;cursor:crosshair}
  #c3dwrap{background:#dfe7ee}
  #c3dwrap canvas{display:block}

  #furnPanel{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(30,35,45,.10);z-index:15}
  #furnPanel.show{display:flex}
  #furnPanel .fname{font-weight:600;font-size:13px}
  #furnPanel input{width:64px;font:12px var(--mono);padding:5px 6px;border:1px solid var(--line);border-radius:6px}
  #furnPanel label{font-size:12px;color:#6b7280}
  #furnPanel .del{color:var(--danger)}

  #menu{position:absolute;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(30,35,45,.12);padding:6px;display:none;z-index:30;min-width:190px}
  #menu.show{display:block}
  #menu button{display:block;width:100%;text-align:left;border-radius:6px}
  #menu button span{color:#8a8f98;font-family:var(--mono);font-size:11px;float:right;margin-left:12px}

  body.notrans .layer{transition:none}
  #toast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:#2b313b;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:70%}
  #toast.show{opacity:.94}

  footer{display:flex;align-items:center;gap:18px;padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:#6b7280}
  footer .mono{font-family:var(--mono)}
  footer .spacer{flex:1}
  kbd{font:11px var(--mono);background:#f0eee8;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:#4b5563}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>户型装修设计台</div>
  <div class="group seg">
    <button id="btn2d" class="on">2D 平面</button>
    <button id="btn3d">3D 鸟瞰</button>
    <button id="btnWalk">第一人称漫游</button>
  </div>
  <div class="group" id="tools2d">
    <button data-tool="select" class="on">选择/移动</button>
    <button data-tool="measure">测量</button>
    <button data-tool="demolish">拆墙</button>
    <button data-tool="floor">地面材料</button>
  </div>
  <div class="group" id="tools3d" style="display:none">
    <span style="font-size:12px;color:#6b7280">WASD 移动 · 按住鼠标拖动转头 · Esc 退出漫游</span>
  </div>
  <div class="group">
    <button id="btnAdd" class="ghost">＋ 添加家具 ▾</button>
  </div>
  <div class="group">
    <button id="btnUndo" class="ghost" title="Ctrl+Z">撤销</button>
    <button id="btnRedo" class="ghost" title="Ctrl+Y">重做</button>
  </div>
  <div class="group">
    <button id="btnClearM" class="ghost">清除测量</button>
    <button id="btnSave" class="ghost">保存</button>
    <button id="btnLoad" class="ghost">读取</button>
    <button id="btnReset" class="ghost">恢复默认</button>
    <button id="btnExport" class="ghost">导出图片</button>
  </div>
</header>

<main id="stage">
  <div class="layer" id="c2dwrap"><canvas id="c2d"></canvas></div>
  <div class="layer hidden" id="c3dwrap"></div>
  <div id="furnPanel">
    <span class="fname" id="fpName">家具</span>
    <label>宽 mm <input id="fpW" type="number" min="200" step="10"></label>
    <label>深 mm <input id="fpD" type="number" min="200" step="10"></label>
    <button id="fpRot" class="ghost">旋转 90°</button>
    <button id="fpDel" class="del">删除</button>
  </div>
  <div id="menu"></div>
  <div id="toast"></div>
</main>

<footer>
  <span id="hint">拖动家具摆放 · 家具靠近墙面自动吸附</span>
  <span class="mono" id="cursorPos"></span>
  <span class="spacer"></span>
  <span>承重墙<span style="display:inline-block;width:14px;height:9px;background:#333a44;border-radius:2px;vertical-align:middle"></span> 普通墙<span style="display:inline-block;width:14px;height:9px;background:#c8cbd1;border:1px solid #9aa0a8;border-radius:2px;vertical-align:middle"></span></span>
  <span>缩放 <span class="mono" id="zoomVal"></span></span>
  <span>套内使用面积 <span class="mono" id="areaVal"></span></span>
</footer>

<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>

const CHAINS={
 top:[0,4760,6540,10270],
 bottom:[0,2240,4520,10270,11850],

};
const ENVELOPE={x0:0,y0:0,x1:11850,y1:10560};

/* ============ 全局状态 ============ */
let S=defaultState();
let tool='select', selectedId=null, hoverWallId=null, hoverRoomId=null;
let measures=[], measureDraft=null;
let history=[], hIdx=-1;
let view={s:0.1,ox:0,oy:0};
let spaceHeld=false, mode='2d', walkOn=false;

const canvas=document.getElementById('c2d'), ctx=canvas.getContext('2d');
const stage=document.getElementById('stage');

function clone(o){return JSON.parse(JSON.stringify(o))}
function snapshot(){return clone({walls:S.walls,openings:S.openings,furniture:S.furniture,floors:S.rooms.map(r=>({id:r.id,floor:r.floor}))})}
function pushHistory(){history=history.slice(0,hIdx+1);history.push(snapshot());if(history.length>60)history.shift();hIdx=history.length-1}
function applySnapshot(sn){S.walls=clone(sn.walls);S.openings=clone(sn.openings);S.furniture=clone(sn.furniture);sn.floors.forEach(f=>{const r=S.rooms.find(r=>r.id===f.id);if(r)r.floor=f.floor});if(!S.furniture.find(f=>f.id===selectedId)){selectedId=null;updatePanel()}render();if(threeReady)rebuild3D()}
function undo(){if(hIdx>0){hIdx--;applySnapshot(history[hIdx]);toast('已撤销')}}
function redo(){if(hIdx<history.length-1){hIdx++;applySnapshot(history[hIdx]);toast('已重做')}}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ 几何工具 ============ */
function roomPoly(r){if(r.poly)return r.poly;const[x,y,w,h]=r.rect;return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function polyArea(poly){let a=0;for(let i=0;i<poly.length;i++){const[p,q]=[poly[i],poly[(i+1)%poly.length]];a+=p[0]*q[1]-q[0]*p[1]}return Math.abs(a)/2}
function pointInPoly(pt,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))inside=!inside}return inside}
function roomAt(x,y){return S.rooms.find(r=>pointInPoly([x,y],roomPoly(r)))}
function furnAABB(f){const rad=(f.rot%180+180)%180===0?0:Math.PI/2;const w=rad===0?f.w:f.d,h=rad===0?f.d:f.w;return{minx:f.cx-w/2,maxx:f.cx+w/2,miny:f.cy-h/2,maxy:f.cy+h/2,horiz:rad===0}}
function wallAt(x,y,pad=0){for(let i=S.walls.length-1;i>=0;i--){const w=S.walls[i];if(x>=w.x-pad&&x<=w.x+w.w+pad&&y>=w.y-pad&&y<=w.y+w.h+pad)return w}return null}

/* ============ 2D 渲染 ============ */
let DPR=devicePixelRatio||1;
function viewW(){return canvas.width/DPR}
function viewH(){return canvas.height/DPR}
function resize2d(){const r=stage.getBoundingClientRect();DPR=devicePixelRatio||1;canvas.width=r.width*DPR;canvas.height=r.height*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);render()}
function fitView(){const r=stage.getBoundingClientRect();const pad=110;const sc=Math.min((r.width-pad*2)/ENVELOPE.x1,(r.height-pad*2)/ENVELOPE.y1);view.s=sc;view.ox=(r.width-ENVELOPE.x1*sc)/2;view.oy=(r.height-ENVELOPE.y1*sc)/2;render()}
const W2S=(x,y)=>[x*view.s+view.ox,y*view.s+view.oy];
const S2W=(x,y)=>[(x-view.ox)/view.s,(y-view.oy)/view.s];

function render(){const W=viewW(),H=viewH();ctx.clearRect(0,0,W,H);ctx.fillStyle='#f6f4ef';ctx.fillRect(0,0,W,H);drawGrid();S.rooms.forEach(drawRoom);S.walls.forEach(w=>drawWall(w));S.walls.forEach(w=>drawOpenings(w));drawMeasures();S.furniture.forEach(drawFurn2D);drawSelection();drawHover();drawChains();drawLegend();updateArea()}

function drawGrid(){const W=viewW(),H=viewH();const[x0,y0]=S2W(0,0),[x1,y1]=S2W(W,H);ctx.lineWidth=1;ctx.strokeStyle='rgba(120,120,110,.10)';ctx.beginPath();for(let gx=Math.floor(x0/1000)*1000;gx<=x1;gx+=1000){const sx=W2S(gx,0)[0];ctx.moveTo(sx,0);ctx.lineTo(sx,H)}for(let gy=Math.floor(y0/1000)*1000;gy<=y1;gy+=1000){const sy=W2S(0,gy)[1];ctx.moveTo(0,sy);ctx.lineTo(W,sy)}ctx.stroke()}

function floorStyle(type){switch(type){
 case'wood':return{fill:'#eadcbd',lines:'rgba(150,105,55,.28)',step:300,dir:'v'};
 case'tile':return{fill:'#e9ebe7',lines:'rgba(110,120,115,.28)',step:600,dir:'grid'};
 case'tileDark':return{fill:'#d2d8d9',lines:'rgba(90,100,105,.3)',step:600,dir:'grid'};
 case'marble':return{fill:'#eef0ee',lines:'rgba(140,150,158,.35)',step:900,dir:'vein'};
 default:return{fill:'#eee'}}}

function drawRoom(r){const poly=roomPoly(r),st=floorStyle(r.floor);ctx.save();ctx.beginPath();poly.forEach((p,i)=>{const[x,y]=W2S(p[0],p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=st.fill;ctx.fill();ctx.clip();

 if(st.dir==='vein'){const[x0,y0,x1,y1]=polyBBox(poly);ctx.strokeStyle=st.lines;ctx.lineWidth=1.2;ctx.beginPath();for(let i=0;i<6;i++){const ox=x0+(x1-x0)*i/6;const a=W2S(ox,y0),b=W2S(ox+(y1-y0)*.4,y1);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke()}
 if(r.id===hoverRoomId&&tool==='floor'){ctx.fillStyle='rgba(29,78,137,.16)';ctx.fill()}
 ctx.restore();
 const[px,py]=W2S(...(r.labelAt||polyCenter(poly)));ctx.textAlign='center';ctx.fillStyle='rgba(43,49,59,.85)';ctx.font='600 14px -apple-system,PingFang SC,sans-serif';ctx.fillText(r.name,px,py-6);ctx.font='11px '+getComputedStyle(document.body).getPropertyValue('--mono');ctx.fillStyle='rgba(43,49,59,.55)';ctx.fillText((polyArea(poly)/1e6).toFixed(1)+' ㎡',px,py+12)}
function polyBBox(poly){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;poly.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});return[x0,y0,x1,y1]}
function polyCenter(poly){const[bx0,by0,bx1,by1]=polyBBox(poly);return[(bx0+bx1)/2,(by0+by1)/2]}

function wallSegs(w){const horiz=w.w>=w.h;const[a0,a1]=horiz?[w.x,w.x+w.w]:[w.y,w.y+w.h];const ops=S.openings.filter(o=>o.wall===w.id).sort((p,q)=>p.a-q.a);const segs=[];let cur=a0;ops.forEach(o=>{if(o.a>cur)segs.push([cur,o.a]);cur=Math.max(cur,o.b)});if(cur<a1)segs.push([cur,a1]);return{horiz,segs,t:horiz?w.h:w.w}}

function drawWall(w){const{horiz,segs,t}=wallSegs(w);ctx.fillStyle=w.load?'#333a44':'#c8cbd1';ctx.strokeStyle=w.load?'#1f242c':'#8b9099';ctx.lineWidth=1;segs.forEach(([a,b])=>{const p=horiz?W2S(a,w.y):W2S(w.x,a);const len=(b-a)*view.s,th=t*view.s;ctx.beginPath();ctx.rect(p[0],p[1],horiz?len:th,horiz?th:len);ctx.fill();ctx.stroke()})}

function drawOpenings(w){const{horiz,t}=wallSegs(w);S.openings.filter(o=>o.wall===w.id).forEach(o=>{
 const th=t*view.s;let p,len;
 if(horiz){p=W2S(o.a,w.y);len=(o.b-o.a)*view.s}else{p=W2S(w.x,o.a);len=(o.b-o.a)*view.s}
 ctx.save();
 if(o.kind==='window'||o.kind==='slider'){ctx.fillStyle='#fff';ctx.strokeStyle='#4a4f57';ctx.lineWidth=1;ctx.beginPath();ctx.rect(p[0],p[1],horiz?len:th,horiz?th:len);ctx.fill();ctx.stroke();ctx.beginPath();const n=o.kind==='slider'?2:3;for(let i=1;i<=n;i++){const off=th*i/(n+1);if(horiz){ctx.moveTo(p[0],p[1]+off);ctx.lineTo(p[0]+len,p[1]+off)}else{ctx.moveTo(p[0]+off,p[1]);ctx.lineTo(p[0]+off,p[1]+len)}}ctx.stroke()}
 else if(o.kind==='door'||o.kind==='entry'){
   const side=o.side||-1;const hinge=[horiz?o.a:o.a,horiz?o.a:o.a];
   let hx,hy,dx,dy;
   if(horiz){hx=o.a;hy=w.y+(side<0?0:t);dx=1;dy=0}
   else{hx=w.y===w.y?w.x:w.x;hx=w.x+(side<0?0:t);hy=o.a;dx=0;dy=1}
   const L=(o.b-o.a);
   const[hx1,hy1]=W2S(hx,hy);
   const ex=hx+ (horiz?(o.b-o.a)*dx: (side<0?-t:t)), ey=horiz?(hy+(side<0?-t:t)*0+ (side<0?0:0)) + 0 : o.b;
   const leafEnd=horiz?[hx,hy+side*L]:[hx+side*L,hy];
   const[lex,ley]=W2S(...leafEnd);
   const[otherX,otherY]=horiz?W2S(o.b,hy):W2S(hx,o.b);
   ctx.strokeStyle='#4a4f57';ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(hx1,hy1);ctx.lineTo(lex,ley);ctx.stroke();
   ctx.strokeStyle='rgba(74,79,87,.55)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
   ctx.beginPath();

   if(horiz)ctx.arc(hx1,hy1,r0,side<0?-Math.PI/2:Math.PI/2,0,side>0);
   else ctx.arc(hx1,hy1,r0,side<0?Math.PI:0,Math.PI/2,side<0);
   ctx.stroke();ctx.setLineDash([]);
   ctx.strokeStyle='#4a4f57';ctx.beginPath();
   if(horiz){ctx.moveTo(W2S(o.a,w.y)[0],W2S(o.a,w.y)[1]);ctx.lineTo(W2S(o.a,w.y+t)[0],W2S(o.a,w.y+t)[1]);ctx.moveTo(otherX,otherY);ctx.lineTo(W2S(o.b,w.y+(horiz?t:0))[0],W2S(o.b,w.y+(horiz?t:0))[1])}
   else{ctx.moveTo(W2S(w.x,o.a)[0],W2S(w.x,o.a)[1]);ctx.lineTo(W2S(w.x+t,o.a)[0],W2S(w.x+t,o.a)[1]);ctx.moveTo(otherX,otherY);ctx.lineTo(W2S(w.x+(horiz?0:t),o.b)[0],W2S(w.x+(horiz?0:t),o.b)[1])}
   ctx.stroke()}
 else{ctx.strokeStyle='rgba(74,79,87,.5)';ctx.setLineDash([5,4]);ctx.lineWidth=1;ctx.beginPath();if(horiz){ctx.moveTo(p[0],p[1]+th/2);ctx.lineTo(p[0]+len,p[1]+th/2)}else{ctx.moveTo(p[0]+th/2,p[1]);ctx.lineTo(p[0]+th/2,p[1]+len)}ctx.stroke();ctx.setLineDash([])}

function drawChain(pts,dir,off){ctx.strokeStyle='#8a8f98';ctx.fillStyle='#5b616b';ctx.lineWidth=1;ctx.font='10.5px '+getComputedStyle(document.body).getPropertyValue('--mono');ctx.beginPath();pts.forEach(p=>{const[x,y]=dir==='h'?W2S(p[0],p[1]+ (off<0?ENVELOPE.y0:0)):W2S(p[0],p[1]);const sx=x+(dir==='h'?0:off*0),sy=y;const[X,Y]=dir==='h'?[x,y+off]:[x+off,y];ctx.moveTo(X-4,Y);ctx.lineTo(X+4,Y);ctx.moveTo(X,Y-4);ctx.lineTo(X,Y+4)});ctx.stroke();
 for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1];const d=dir==='h'?q[0]-p[0]:q[1]-p[1];if(d<=0)continue;const[mx,my]=dir==='h'?[(p[0]+q[0])/2,p[1]]:[p[0],(p[1]+q[1])/2];const[X,Y]=dir==='h'?W2S(mx,my):W2S(mx,my);const lx=dir==='h'?X:X+off,ly=dir==='h'?Y+off:Y;ctx.save();ctx.translate(lx,ly);if(dir==='v')ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(String(d),0,0);ctx.fillStyle='#5b616b';ctx.fillText(String(d),0,0);ctx.restore();
  const[a1,b1]=dir==='h'?W2S(p[0],p[1]):W2S(p[0],p[1]);const[a2,b2]=dir==='h'?W2S(q[0],q[1]):W2S(q[0],q[1]);ctx.beginPath();if(dir==='h'){const Y=(off<0?W2S(0,ENVELOPE.y0)[1]:W2S(0,ENVELOPE.y1)[1])+off;ctx.moveTo(a1,Y);ctx.lineTo(a2,Y)}else{const X=(off<0?W2S(ENVELOPE.x0,0)[0]:W2S(ENVELOPE.x1,0)[0])+off;ctx.moveTo(X,b1);ctx.lineTo(X,b2)}ctx.stroke()}}

function drawFurn2D(f){ctx.save();const[cx,cy]=W2S(f.cx,f.cy);ctx.translate(cx,cy);ctx.rotate(f.rot*Math.PI/180);const w=f.w*view.s,d=f.d*view.s;

function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function drawFurnType(c,type,w,d){const ink='#4a4f57';c.lineWidth=1.2;c.strokeStyle=ink;c.fillStyle='#fdfdfb';
 const box=(x,y,ww,hh,rad)=>{rr(c,x,y,ww,hh,rad||2);c.fill();c.stroke()};
 switch(type){
  case'bed':{box(-w/2,-d/2,w,d,3);c.beginPath();c.moveTo(-w/2,-d/2+d*0.09);c.lineTo(w/2,-d/2+d*0.09);c.stroke();const pw=w>0.9? (w-14)/2:w-10;const py=-d/2+d*0.13,ph=d*0.14;box(-w/2+5,py,pw,ph,ph/2.4);if(w>0.9)box(5+ -w/2+pw+4? -w/2+5+pw+4:0,py,pw,ph,ph/2.4);c.beginPath();c.moveTo(-w/2,d/2-d*0.16);c.lineTo(w/2,d/2-d*0.16);c.stroke();break}
  case'nightstand':box(-w/2,-d/2,w,d,3);c.beginPath();c.arc(0,0,Math.min(w,d)*0.22,0,7);c.stroke();break;
  case'wardrobe':box(-w/2,-d/2,w,d,2);c.beginPath();c.moveTo(-w/2,0);c.lineTo(w/2,0);c.stroke();for(let i=1;i<6;i++){const x=-w/2+w*i/6;c.beginPath();c.moveTo(x,-d/2+2);c.lineTo(x,d/2-2);c.stroke()}break;
  case'desk':box(-w/2,-d/2,w,d,2);c.strokeStyle='rgba(74,79,87,.4)';c.strokeRect(-w/2+4,-d/2+4,w-8,d-8);break;
  case'chair':{box(-w/2,-d/2,w,d,6);c.lineWidth=3;c.beginPath();c.moveTo(-w/2+2,d/2-2);c.lineTo(w/2-2,d/2-2);c.stroke();break}
  case'lounge':{box(-w/2,-d/2,w,d,8);c.lineWidth=3;c.beginPath();c.moveTo(-w/2+3,d/2-4);c.lineTo(w/2-3,d/2-4);c.stroke();c.lineWidth=1.2;c.beginPath();c.moveTo(-w/2,-d/2+8);c.lineTo(-w/2,d/2-8);c.moveTo(w/2,-d/2+8);c.lineTo(w/2,d/2-8);c.stroke();break}
  case'sofa':{box(-w/2,-d/2,w,d,8);const bw=d*0.22;c.strokeRect(-w/2,-d/2,w,bw);c.strokeRect(-w/2,d/2-bw*0.9,w*0.1,bw*0.9);c.strokeRect(w/2-w*0.1,d/2-bw*0.9,w*0.1,bw*0.9);c.beginPath();for(let i=1;i<3;i++){c.moveTo(-w/2+w*i/3,bw);c.lineTo(-w/2+w*i/3,d/2-bw*0.9)}c.stroke();break}
  case'table':box(-w/2,-d/2,w,d,w<d?w/2:3);c.strokeStyle='rgba(74,79,87,.35)';c.strokeRect(-w/2+5,-d/2+5,w-10,d-10);break;
  case'tv':box(-w/2,-d/2,w,d,2);c.lineWidth=3;c.beginPath();c.moveTo(-w/2+8,-d/2+3);c.lineTo(w/2-8,-d/2+3);c.stroke();break;
  case'rug':{c.fillStyle='rgba(214,120,96,.16)';c.strokeStyle='rgba(180,90,70,.5)';c.setLineDash([7,5]);rr(c,-w/2,-d/2,w,d,6);c.fill();c.stroke();c.setLineDash([]);break}
  case'toilet':{const tw=Math.min(w,d)*0.9;c.fillStyle='#fdfdfb';box(-w/2,-d/2,w*0.32,d,2);c.beginPath();c.ellipse(w/2-w*0.32,tw*0, w*0.62, d*0.36,0,0,7);c.fill();c.stroke();break}
  case'basin':box(-w/2,-d/2,w,d,4);c.beginPath();c.ellipse(0,d*0.05,w*0.32,d*0.3,0,0,7);c.stroke();c.beginPath();c.arc(0,-d/2+6,3,0,7);c.fillStyle=ink;c.fill();break;
  case'shower':{box(-w/2,-d/2,w,d,2);c.beginPath();c.moveTo(-w/2,-d/2);c.lineTo(w/2,d/2);c.moveTo(w/2,-d/2);c.lineTo(-w/2,d/2);c.stroke();c.beginPath();c.arc(0,0,6,0,7);c.stroke();break}
  case'stove':box(-w/2,-d/2,w,d,2);[[-w/4,-d/4],[w/4,-d/4],[-w/4,d/4],[w/4,d/4]].forEach(p=>{c.beginPath();c.arc(p[0],p[1],Math.min(w,d)*0.16,0,7);c.stroke()});break;
  case'sink':box(-w/2,-d/2,w,d,4);rr(c,-w*0.32,-d*0.3,w*0.64,d*0.6,8);c.stroke();c.beginPath();c.arc(0,-d/2+7,3,0,7);c.fill();break;
  case'fridge':box(-w/2,-d/2,w,d,3);c.beginPath();c.moveTo(-w/2,0);c.lineTo(w/2,0);c.moveTo(w/2-6,-d/2+8);c.lineTo(w/2-6,-4);c.stroke();break;
  case'counter':{c.fillStyle='rgba(214,214,206,.7)';box(-w/2,-d/2,w,d,2);c.strokeStyle='rgba(74,79,87,.4)';c.setLineDash([5,4]);c.strokeRect(-w/2+5,-d/2+5,w-10,d-10);c.setLineDash([]);break}
  case'washer':box(-w/2,-d/2,w,d,4);c.beginPath();c.arc(0,2,d*0.3,0,7);c.stroke();c.beginPath();c.arc(0,-d/2+8,4,0,7);c.stroke();break;
  case'cab':case'shelf':box(-w/2,-d/2,w,d,2);c.beginPath();const n=type==='shelf'?4:2;for(let i=1;i<n;i++){const x=-w/2+w*i/n;c.moveTo(x,-d/2+3);c.lineTo(x,d/2-3)}c.stroke();break;
  case'plant':{c.beginPath();c.arc(0,0,w/2,0,7);c.fillStyle='#dfe9da';c.fill();c.stroke();for(let i=0;i<6;i++){const a=i*Math.PI/3;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*w*0.42,Math.sin(a)*w*0.42);c.stroke()}break}
  default:box(-w/2,-d/2,w,d,2)}
}

function furnAt(wx,wy){for(let i=S.furniture.length-1;i>=0;i--){const f=S.furniture[i];const dx=wx-f.cx,dy=wy-f.cy;const a=-f.rot*Math.PI/180;const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);if(Math.abs(lx)<=f.w/2&&Math.abs(ly)<=f.d/2)return f}return null}

const SNAP=110;
function snapToWalls(f){const bb=furnAABB(f);let bestX=null,bestY=null;
 S.walls.forEach(w=>{const facesV=[w.x,w.x+w.w],facesH=[w.y,w.y+w.h];
  facesV.forEach(fx=>{let d1=Math.abs(bb.maxx-fx),d2=Math.abs(bb.minx-fx);
   if(d1<SNAP&&(!bestX||d1<bestX.d))bestX={d:d1,shift:fx-bb.maxx};

function buildWall3D(w){const horiz=w.w>=w.h;const t=horiz?w.h:w.w;const mat=w.load?MAT.load:MAT.part;
 const ops=S.openings.filter(o=>o.wall===w.id).sort((p,q)=>p.a-q.a);
 const segs=[];let cur=w.id.startsWith('e')||w.id.startsWith('p')?0:0;let start=horiz?w.x:w.y;const end=horiz?w.x+w.w:w.y+w.h;cur=start;
 ops.forEach(o=>{if(o.a>cur)segs.push([cur,o.a]);cur=Math.max(cur,o.b)});

 segs.forEach(([a,b])=>{const len=b-a,mid=(a+b)/2;if(horiz)box(len,WALL_H,t,mat,mid,WALL_H/2,w.y+t/2);else box(t,WALL_H,len,mat,w.x+t/2,WALL_H/2,mid)});
 ops.forEach(o=>{

   leaf.rotation.y=(horiz?(o.side<0?1:-1):(o.side<0?-1:1))*Math.PI/2*0.8;
   planGroup.add(leaf)}

   const sill=o.kind==='slider'?60:WIN_SILL,head=WIN_HEAD;

   else{box(t,sill,cut,mat,w.x+t/2,sill/2,mid);box(t,WALL_H-head,cut,mat,w.x+t/2,head+(WALL_H-head)/2,mid);box(40,head-sill-40,cut,MAT.glass,w.x+t/2,(sill+head)/2,mid)}}

function tweenCam(toPos,toTarget,dur,done){const fromP=camera.position.clone(),fromT=controls?controls.target.clone():new THREE.Vector3(...CENTER,0);const t0=performance.now();camTween={cancel:()=>camTween=null};

function bindWalk(){const el=renderer.domElement;let looking=false,lx=0,ly=0;
 el.addEventListener('pointerdown',e=>{if(!walkOn)return;looking=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!looking||!walkOn)return;walk.yaw-=(e.clientX-lx)*0.004;walk.pitch=Math.max(-1.2,Math.min(1.2,walk.pitch-(e.clientY-ly)*0.003));lx=e.clientX;ly=e.clientY});
 el.addEventListener('pointerup',()=>looking=false);
 window.addEventListener('keydown',e=>{walk.keys[e.code]=true;if(e.code==='Escape'&&walkOn)exitWalk()});
 window.addEventListener('keyup',e=>walk.keys[e.code]=false)}
let lastT=performance.now();
function animate3D(){requestAnimationFrame(animate3D);const now=performance.now(),dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
 if(walkOn){const sp=3200*dt;let fx=0,fz=0;const k=walk.keys;if(k.KeyW||k.ArrowUp)fz+=1;if(k.KeyS||k.ArrowDown)fz-=1;if(k.KeyA||k.ArrowLeft)fx-=1;if(k.KeyD||k.ArrowRight)fx+=1;
  if(fx||fz){const sin=Math.sin(walk.yaw),cos=Math.cos(walk.yaw);camera.position.x+=(fz*sin+fx*cos)*sp;camera.position.z+=(fz*cos-fx*sin)*sp;
   camera.position.x=Math.max(400,Math.min(11700,camera.position.x));camera.position.z=Math.max(400,Math.min(10300,camera.position.z))}
  camera.rotation.order='YXZ';camera.rotation.y=walk.yaw+Math.PI;camera.rotation.x=walk.pitch}
 else if(controls.enabled)controls.update();
 if(mode!=='2d')renderer.render(scene,camera)}

/* ============ 启动 ============ */
const SNAPTEST=new URLSearchParams(location.search).has('snap');
if(SNAPTEST)document.body.classList.add('notrans');
window.RENO={get state(){return S},W2S,S2W,undo,redo,pushHistory,get measures(){return measures},get history(){return history},get selectedId(){return selectedId},get tool(){return tool},furnAt,snapToWalls,LS_KEY};
const bootParam=new URLSearchParams(location.search).get('v');
(function boot(){const raw=localStorage.getItem(LS_KEY);if(raw){try{restoreData(JSON.parse(raw))}catch(e){}}
 pushHistory();resize2d();fitView();
 if(bootParam==='3d'){go3D()}else if(bootParam==='walk'){go3D();SNAPTEST?enterWalk():setTimeout(enterWalk,1150)}})();
</script>
